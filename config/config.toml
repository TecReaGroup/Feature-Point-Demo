[logging]
# DEBUG < PERF < INFO < WARNING < ERROR < CRITICAL
level = "INFO"

[camera]
index = 0
# Options: dshow, msmf, auto.
backend = "dshow"
width = 1280
height = 720
fps = 30

[recognition]
# Options: cuda, cpu, auto. Auto prefers CUDA when available.
device = "cuda"
max_keypoints = 1024
image_size = 768
min_inliers = 12
min_inlier_ratio = 0.45
ransac_threshold = 4.0
